  <radialGradient id="halo"><stop stop-color="#0e4160" stop-opacity=".72"/><stop offset=".58" stop-color="#0a1d31" stop-opacity=".26"/><stop offset="1" stop-color="#05070d" stop-opacity="0"/></radialGradient>
  <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#1675ff" stop-opacity=".08"/><stop offset=".55" stop-color="#38d9ff"/><stop offset="1" stop-color="#b6f5ff"/></linearGradient>
