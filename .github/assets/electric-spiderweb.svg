<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">OneByte Agent — Electric Spiderweb</title>
<desc id="desc">A neon cyan and red electric web converges on the OneByte intelligence core.</desc>
<defs>
