name: TypeScript validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Android config plugin
        run: |
          node --check plugins/withAndroidLocalHttp.js
          npx expo config --type public > /tmp/onebyte-expo-config.json
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: React preview regression tests
        run: npm run test:preview
      - name: ZIP safety regression tests
        run: npm run test:safety
      - name: Hunter parser regression tests
        run: npm run test:hunter
