kind = "mobile"
previewPath = "/onebyte-agent/"
title = "OneByte Agent"
description = "An Android-first companion for authorized security assessment workflows: organize approved scopes, track assessment tasks, review approval requests, and document findings safely."
version = "1.0.0"
id = "artifacts/onebyte-agent"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/onebyte-agent/" ]
localPort = 22355

[services.development]
run = "pnpm --filter @workspace/onebyte-agent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/onebyte-agent", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/onebyte-agent", "run", "serve" ]

[services.env]
PORT = "22355"
BASE_PATH = "/onebyte-agent/"
